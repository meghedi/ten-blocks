<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ten blocks and number lines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: cheerful classroom, big friendly targets, calm feedback
   IDEA: a wooden tray of math manipulatives on a school desk
   PICTURE: the blocks and the number line themselves, drawn large
   COLOUR and TYPE: sky ground, sunny yellow ones, blue tens, coral hundreds; Fredoka throughout
   LAYOUT: title and stars, activity tabs, the work area, then the answer row */
:root{color-scheme:light dark;
  --bg:light-dark(#dff0ff,#13202f);--card:light-dark(#ffffff,#1c2c40);--ink:light-dark(#1b2838,#eef4fb);
  --soft:light-dark(#566679,#a8b8ca);--tray:light-dark(#f4e4c6,#3a3024);--trayedge:light-dark(#d9bf90,#5a4934);
  --one:#ffc23d;--ten:#3d8bff;--hun:#ff6f59;--ok:#1f9d55;--bad:#e5484d;--u:20px;--uf:10px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Fredoka,"Comic Sans MS",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(16px,3vw,36px) max(4vw,14px) 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
.stars{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:6px 8px 6px 16px;font-size:22px;font-weight:600}
.stars svg{width:28px;height:28px}
.stars.bump svg{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.5) rotate(20deg)}}
.small{font:inherit;font-size:14px;border:0;background:transparent;color:var(--soft);cursor:pointer;padding:8px 10px;border-radius:999px}
.small:hover{background:var(--bg)}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap;background:var(--card);padding:6px;border-radius:18px}
.pills button{font:inherit;font-weight:600;font-size:17px;border:0;border-radius:13px;padding:10px 16px;min-height:44px;cursor:pointer;background:transparent;color:var(--ink)}
.pills button[aria-pressed=true]{background:var(--ten);color:#fff}
.pills.lv button[aria-pressed=true]{background:var(--hun)}
button:focus-visible,input:focus-visible{outline:3px solid var(--one);outline-offset:2px}
.card{background:var(--card);border-radius:24px;padding:clamp(16px,3vw,28px);box-shadow:0 6px 0 light-dark(#bcd8f2,#0b141e)}
.prompt{font-size:clamp(20px,3vw,26px);font-weight:600;margin:0 0 14px}
.prompt b{color:var(--hun);font-size:1.3em}
.tray{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;min-height:240px;padding:22px;background:var(--tray);border:4px solid var(--trayedge);border-radius:18px}
.grp{display:flex;flex-direction:column;align-items:center;gap:8px}
.grp .row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:center}
.grp span{font-size:15px;color:light-dark(#6b5530,#d9c49c);font-weight:500}
.empty{color:light-dark(#6b5530,#d9c49c);margin:auto}
.cube{width:var(--u);height:var(--u);background:var(--one);border-radius:3px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.18),inset 2px 2px 0 rgba(255,255,255,.45)}
.ones{display:grid;grid-template-columns:repeat(5,var(--u));gap:4px}
.rod{width:var(--u);height:calc(var(--u)*10);border-radius:3px;background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--u) - 2px),rgba(0,0,0,.28) calc(var(--u) - 2px) var(--u)),var(--ten);box-shadow:inset -3px 0 0 rgba(0,0,0,.18),inset 2px 0 0 rgba(255,255,255,.4)}
.flat{width:calc(var(--uf)*10);height:calc(var(--uf)*10);border-radius:3px;background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--uf) - 1px),rgba(0,0,0,.25) calc(var(--uf) - 1px) var(--uf)),repeating-linear-gradient(to right,transparent 0 calc(var(--uf) - 1px),rgba(0,0,0,.25) calc(var(--uf) - 1px) var(--uf)),var(--hun);box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)}
.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}}
form{margin:0}
.asks{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;margin-top:20px}
.ask{display:flex;flex-direction:column;gap:4px;font-weight:600}
.ask span{font-size:15px;color:var(--soft)}
.ask .dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
input.num{font:inherit;font-weight:600;font-size:28px;width:96px;height:60px;text-align:center;border:3px solid light-dark(#b9cbe0,#3b5372);border-radius:14px;background:light-dark(#f7fbff,#14202f);color:var(--ink)}
input.num.big{width:130px}
input.good{border-color:var(--ok);background:light-dark(#e3f7ea,#143223)}
input.wrong{border-color:var(--bad);background:light-dark(#fde8e8,#3a1a1c)}
.go{font:inherit;font-size:20px;font-weight:700;border:0;border-radius:16px;padding:0 26px;height:60px;cursor:pointer;background:var(--ten);color:#fff;box-shadow:0 4px 0 #2563c9}
.go.next{background:var(--ok);box-shadow:0 4px 0 #157541}
.go:active{transform:translateY(3px);box-shadow:none}
.msg{margin-top:16px;font-size:22px;font-weight:600;min-height:34px}
.msg.ok{color:var(--ok)}.msg.try{color:var(--bad)}
.ctls{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px}
.ctl{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:8px 10px}
.ctl .nm{font-weight:600;min-width:84px;display:flex;align-items:center;gap:8px}
.ctl button{font:inherit;font-size:26px;font-weight:700;width:48px;height:48px;border-radius:12px;border:0;cursor:pointer;background:var(--card);color:var(--ink)}
.ctl output{font-size:24px;font-weight:700;width:28px;text-align:center}
.nlbox{overflow-x:auto;padding:8px 0 4px}
.nl{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 22px;min-width:330px}
.nl::before{content:"";position:absolute;left:6px;right:6px;top:28px;height:5px;background:var(--ink);border-radius:3px}
.arr{position:absolute;top:20px;width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent}
.arr.l{left:0;border-right:16px solid var(--ink)}.arr.r{right:0;border-left:16px solid var(--ink)}
.tk{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:14px}
.tk i{display:block;width:5px;height:33px;background:var(--ink);border-radius:3px}
.tk .val{font-size:clamp(22px,4vw,32px);font-weight:700;height:56px;display:flex;align-items:center}
.tk .val.mid{background:var(--one);color:#1b2838;border-radius:14px;padding:0 12px}
.tk input.num{width:min(100%,86px);height:56px;font-size:clamp(18px,3.6vw,26px);padding:0 2px}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.note{color:var(--soft);font-size:15px;margin:14px 0 0}
@media(max-width:600px){:root{--u:15px;--uf:8px}.tray{padding:14px;gap:14px;min-height:190px}.pills button{padding:8px 12px;font-size:16px}input.num{width:80px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="root"><div class="wrap"><h1>Ten blocks and number lines</h1><p>Loading...</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel" data-presets="react">
{
const {useState, useEffect} = React;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const CHEERS = ["You got it!", "Great counting!", "Super job!", "That's right!", "Way to go!"];
const cheer = () => CHEERS[rnd(0, CHEERS.length - 1)];
const LEVELS = [{id: 20, label: "Up to 20"}, {id: 100, label: "Up to 100"}, {id: 1000, label: "Up to 1000"}];
const pick = lv => lv === 20 ? rnd(1, 20) : lv === 100 ? rnd(11, 99) : rnd(100, 999);
const split = n => ({h: Math.floor(n / 100), t: Math.floor((n % 100) / 10), o: n % 10});
const clean = v => v.replace(/\D/g, "").slice(0, 4);
const COLORS = {h: "var(--hun)", t: "var(--ten)", o: "var(--one)"};
const NAMES = {h: "Hundreds", t: "Tens", o: "Ones"};

function Star() {
  return <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" fill="#ffc23d" stroke="#d9971a" strokeWidth="1.2" strokeLinejoin="round"/></svg>;
}
const times = (n, f) => Array.from({length: n}, (_, i) => f(i));

function Blocks({n, labels}) {
  const {h, t, o} = split(n);
  if (n === 0) return <div className="tray"><p className="empty">The tray is empty. Add some blocks!</p></div>;
  return (
    <div className="tray" aria-label={labels ? `${h} hundreds, ${t} tens, ${o} ones` : "Base ten blocks"}>
      {h > 0 && <div className="grp"><div className="row">{times(h, i => <div key={i} className="flat pop"/>)}</div>{labels && <span>{h} hundred{h > 1 ? "s" : ""}</span>}</div>}
      {t > 0 && <div className="grp"><div className="row">{times(t, i => <div key={i} className="rod pop"/>)}</div>{labels && <span>{t} ten{t > 1 ? "s" : ""}</span>}</div>}
      {o > 0 && <div className="grp"><div className="ones">{times(o, i => <div key={i} className="cube pop"/>)}</div>{labels && <span>{o} one{o > 1 ? "s" : ""}</span>}</div>}
    </div>
  );
}

function Field({label, color, value, onChange, mark, big}) {
  return (
    <label className="ask">
      <span>{color && <i className="dot" style={{background: color}}/>}{label}</span>
      <input className={"num" + (big ? " big" : "") + (mark ? " " + mark : "")} inputMode="numeric" autoComplete="off"
        value={value} onChange={e => onChange(clean(e.target.value))}/>
    </label>
  );
}

function Count({level, win}) {
  const places = level === 1000 ? ["h", "t", "o"] : ["t", "o"];
  const blank = {h: "", t: "", o: "", n: ""};
  const [n, setN] = useState(() => pick(level));
  const [a, setA] = useState(blank);
  const [res, setRes] = useState(null);
  const next = () => { setN(pick(level)); setA(blank); setRes(null); };
  useEffect(next, [level]);
  const want = {...split(n), n};
  const right = f => a[f] !== "" && +a[f] === want[f];
  const mark = f => res ? (right(f) ? "good" : "wrong") : "";
  const check = () => {
    const ok = [...places, "n"].every(right);
    setRes(ok ? cheer() : "try");
    if (ok) win();
  };
  const set = f => v => { setA({...a, [f]: v}); if (res === "try") setRes(null); };
  const done = res && res !== "try";
  return (
    <form onSubmit={e => { e.preventDefault(); done ? next() : check(); }}>
      <p className="prompt">Count the blocks. What number is it?</p>
      <Blocks n={n}/>
      <div className="asks">
        {places.map(f => <Field key={f} label={NAMES[f]} color={COLORS[f]} value={a[f]} onChange={set(f)} mark={mark(f)}/>)}
        <Field label="The number is" value={a.n} onChange={set("n")} mark={mark("n")} big/>
        <button className={"go" + (done ? " next" : "")} type="submit">{done ? "Next" : "Check"}</button>
      </div>
      <div className={"msg " + (res === "try" ? "try" : "ok")} aria-live="polite">
        {res === "try" ? "Almost! Look again at the red boxes." : res || ""}
      </div>
      <p className="note">Tip: a blue rod is 10 cubes. A red flat is 10 rods, or 100 cubes.</p>
    </form>
  );
}

function Build({level, win}) {
  const places = level === 1000 ? ["h", "t", "o"] : ["t", "o"];
  const [target, setTarget] = useState(() => pick(level));
  const [c, setC] = useState({h: 0, t: 0, o: 0});
  const [res, setRes] = useState(null);
  const next = () => { setTarget(pick(level)); setC({h: 0, t: 0, o: 0}); setRes(null); };
  useEffect(next, [level]);
  const total = c.h * 100 + c.t * 10 + c.o;
  const add = (f, d) => { setC({...c, [f]: Math.max(0, Math.min(9, c[f] + d))}); if (res === "try") setRes(null); };
  const done = res && res !== "try";
  const check = () => { const ok = total === target; setRes(ok ? cheer() : "try"); if (ok) win(); };
  const hint = total < target ? "You need more blocks." : "That's too many blocks.";
  return (
    <div>
      <p className="prompt">Build the number <b>{target}</b> with blocks.</p>
      <Blocks n={total} labels/>
      <div className="ctls">
        {places.map(f => (
          <div className="ctl" key={f}>
            <span className="nm"><i className="dot" style={{display: "inline-block", width: 14, height: 14, borderRadius: 3, background: COLORS[f]}}/>{NAMES[f]}</span>
            <button type="button" aria-label={"Take away one " + NAMES[f].toLowerCase().slice(0, -1)} onClick={() => add(f, -1)} disabled={done}>−</button>
            <output>{c[f]}</output>
            <button type="button" aria-label={"Add one " + NAMES[f].toLowerCase().slice(0, -1)} onClick={() => add(f, 1)} disabled={done}>+</button>
          </div>
        ))}
        <button className={"go" + (done ? " next" : "")} type="button" onClick={done ? next : check}>{done ? "Next" : "Check"}</button>
      </div>
      <div className={"msg " + (res === "try" ? "try" : "ok")} aria-live="polite">
        {res === "try" ? "Not yet. " + hint : res ? `${res} ${target} is ${places.map(f => `${split(target)[f]} ${NAMES[f].toLowerCase()}`).join(", ")}.` : ""}
      </div>
    </div>
  );
}

function makeLine(level, step) {
  let c;
  if (step === 1) c = level === 20 ? rnd(3, 17) : level === 100 ? rnd(3, 96) : rnd(103, 996);
  else c = level === 1000 ? rnd(3, 96) * 10 : rnd(3, 7) * 10;
  return [-3, -2, -1, 0, 1, 2, 3].map(k => c + k * step);
}

function Line({level, win}) {
  const [step, setStep] = useState(1);
  const [mode, setMode] = useState("near");
  const [vals, setVals] = useState(() => makeLine(level, 1));
  const [a, setA] = useState({});
  const [res, setRes] = useState(null);
  const fresh = (s = step) => { setVals(makeLine(level, s)); setA({}); setRes(null); };
  useEffect(() => fresh(), [level]);
  const hidden = mode === "near" ? [2, 4] : [0, 1, 2, 4, 5, 6];
  const right = i => a[i] !== undefined && a[i] !== "" && +a[i] === vals[i];
  const done = res && res !== "try";
  const check = () => { const ok = hidden.every(right); setRes(ok ? cheer() : "try"); if (ok) win(); };
  return (
    <form onSubmit={e => { e.preventDefault(); done ? fresh() : check(); }}>
      <div className="opts">
        <div className="pills" role="group" aria-label="Count by">
          {[1, 10].map(s => <button type="button" key={s} aria-pressed={step === s} onClick={() => { setStep(s); fresh(s); }}>Count by {s}s</button>)}
        </div>
        <div className="pills" role="group" aria-label="Blanks">
          <button type="button" aria-pressed={mode === "near"} onClick={() => { setMode("near"); fresh(); }}>Before and after</button>
          <button type="button" aria-pressed={mode === "all"} onClick={() => { setMode("all"); fresh(); }}>Fill the whole line</button>
        </div>
      </div>
      <p className="prompt">{mode === "near" ? <>What comes just before and just after <b>{vals[3]}</b>?</> : <>Fill in the number line around <b>{vals[3]}</b>.</>}</p>
      <div className="nlbox">
        <div className="nl">
          <span className="arr l"/><span className="arr r"/>
          {vals.map((v, i) => (
            <div className="tk" key={i}>
              <i/>
              {hidden.includes(i)
                ? <input className={"num" + (res ? (right(i) ? " good" : " wrong") : "")} inputMode="numeric" autoComplete="off"
                    aria-label={i < 3 ? `${3 - i} before ${vals[3]}` : `${i - 3} after ${vals[3]}`}
                    value={a[i] || ""} onChange={e => { setA({...a, [i]: clean(e.target.value)}); if (res === "try") setRes(null); }}/>
                : <span className={"val" + (i === 3 ? " mid" : "")}>{v}</span>}
            </div>
          ))}
        </div>
      </div>
      <div className="asks">
        <button className={"go" + (done ? " next" : "")} type="submit">{done ? "Next" : "Check"}</button>
      </div>
      <div className={"msg " + (res === "try" ? "try" : "ok")} aria-live="polite">
        {res === "try" ? (step === 1 ? "Almost! Going right adds 1. Going left takes away 1." : "Almost! Going right adds 10. Going left takes away 10.") : res || ""}
      </div>
    </form>
  );
}

function App() {
  const [tab, setTab] = useState(() => load("tb-tab", "count"));
  const [level, setLevel] = useState(() => load("tb-level", 100));
  const [stars, setStars] = useState(() => load("tb-stars", 0));
  const [bump, setBump] = useState(0);
  useEffect(() => save("tb-tab", tab), [tab]);
  useEffect(() => save("tb-level", level), [level]);
  useEffect(() => save("tb-stars", stars), [stars]);
  const win = () => { setStars(s => s + 1); setBump(b => b + 1); };
  const tabs = [["count", "Count the blocks"], ["build", "Build a number"], ["line", "Number line"]];
  const View = tab === "build" ? Build : tab === "line" ? Line : Count;
  return (
    <div className="wrap">
      <header>
        <h1>Ten blocks and number lines</h1>
        <div className={"stars" + (bump > 0 ? " bump" : "")} key={bump} aria-label={stars + " stars"}>
          <Star/>{stars}
          <button className="small" type="button" onClick={() => setStars(0)}>Reset</button>
        </div>
      </header>
      <div className="bar">
        <div className="pills" role="group" aria-label="Activity">
          {tabs.map(([id, lab]) => <button type="button" key={id} aria-pressed={tab === id} onClick={() => setTab(id)}>{lab}</button>)}
        </div>
        <div className="pills lv" role="group" aria-label="Level">
          {LEVELS.map(l => <button type="button" key={l.id} aria-pressed={level === l.id} onClick={() => setLevel(l.id)}>{l.label}</button>)}
        </div>
      </div>
      <div className="card"><View key={tab} level={level} win={win}/></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
}
</script>
</body>
</html>
